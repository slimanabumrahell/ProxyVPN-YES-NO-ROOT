name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch hev-socks5-tunnel source
        uses: actions/checkout@v4
        with:
          repository: heiher/hev-socks5-tunnel
          submodules: recursive
          path: hev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Locate native build files
        run: |
          echo "--- top level ---"
          ls -la hev
          echo "--- all Android.mk ---"
          find hev -name "Android.mk" -not -path "*/third-part/*"
          echo "--- files that define the library ---"
          grep -rl "hev-socks5-tunnel" hev --include=*.mk --include=*.txt --include=*.cmake --include=CMakeLists.txt || true

      - name: Build JNI library
        working-directory: hev
        run: |
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM=android-26 \
            -j$(nproc)
          find . -name "libhev-socks5-tunnel.so" -not -path "*/obj/*"

      - name: Install native libs and Java binding
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a; do
            SO=$(find hev/libs/$ABI -name "libhev-socks5-tunnel.so" | head -n 1)
            test -n "$SO" || { echo "missing $ABI .so"; exit 1; }
            mkdir -p app/src/main/jniLibs/$ABI
            cp "$SO" app/src/main/jniLibs/$ABI/libhev-socks5-tunnel.so
          done
          JAVA=$(find hev -name TProxyService.java -not -path "*/third-part/*" | head -n 1)
          test -n "$JAVA" || { echo "TProxyService.java not found"; exit 1; }
          mkdir -p app/src/main/java/hev/htproxy
          cp "$JAVA" app/src/main/java/hev/htproxy/TProxyService.java

      - name: Verify JNI symbols
        run: |
          SO=app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          echo "--- exported symbols ---"
          nm -D "$SO" | grep -iE "JNI_OnLoad|hev|TProxy" || true
          echo "--- strings ---"
          strings "$SO" | grep -iE "htproxy|TProxy|JNI_OnLoad" || true
          echo "--- java class referenced ---"
          strings "$SO" | grep -E "^hev/" | head -n 5 || true

      - name: Download gost binary
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o gost.tar.gz \
            "https://github.com/go-gost/gost/releases/download/v3.3.4/gost_3.3.4_linux_arm64.tar.gz"
          tar -xzf gost.tar.gz gost
          mv gost app/src/main/jniLibs/arm64-v8a/libgost.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: gradle wrapper --gradle-version 8.9
      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyVPN-debug
          path: app/build/outputs/apk/debug/*.apk
