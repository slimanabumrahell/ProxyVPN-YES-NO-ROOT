name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch hev-socks5-tunnel source
        uses: actions/checkout@v4
        with:
          repository: heiher/hev-socks5-tunnel
          submodules: recursive
          path: hev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build JNI library
        run: |
          MK=$(find hev -name Android.mk | head -n 1)
          echo "Android.mk: $MK"
          DIR=$(dirname "$MK")
          ndk-build -C "$DIR" NDK_PROJECT_PATH="$DIR" APP_ABI="arm64-v8a armeabi-v7a" -j$(nproc)
          find hev -name "libhev-socks5-tunnel.so" -path "*/obj/*" -o -path "*/libs/*" | head -n 20

      - name: Install native libs and Java binding
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a; do
            SO=$(find hev -name "libhev-socks5-tunnel.so" -path "*${ABI}*" | head -n 1)
            test -n "$SO" || { echo "missing $ABI .so"; exit 1; }
            mkdir -p app/src/main/jniLibs/$ABI
            cp "$SO" app/src/main/jniLibs/$ABI/libhev-socks5-tunnel.so
          done
          JAVA=$(find hev -name TProxyService.java | head -n 1)
          test -n "$JAVA" || { echo "TProxyService.java not found"; exit 1; }
          mkdir -p app/src/main/java/hev/htproxy
          cp "$JAVA" app/src/main/java/hev/htproxy/TProxyService.java

      - name: Verify JNI symbols
        run: |
          nm -D app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so | grep -i "Java_hev_htproxy_TProxyService" || { echo "JNI symbols missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: gradle wrapper --gradle-version 8.9
      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyVPN-debug
          path: app/build/outputs/apk/debug/*.apk
